{{define "top"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{.Title}} – {{.Theme.Title}}</title>
{{if .Theme.FontURL}}<link rel="stylesheet" href="{{.Theme.FontURL}}">{{end}}
<style>
:root {
  --bg: {{.Theme.Background}}; --surface: {{.Theme.Surface}}; --text: {{.Theme.Text}}; --muted: {{.Theme.Muted}};
  --line: {{.Theme.Line}}; --accent: {{.Theme.Accent}}; --on-accent: {{.Theme.OnAccent}}; --danger: {{.Theme.Danger}};
  --font: {{.FontCSS}};
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); }
main { width: min({{if .Wide}}760px{{else}}440px{{end}}, 100%); margin: 0 auto; padding: 40px 16px 64px; }
.brand { display: inline-block; margin-bottom: 28px; color: var(--muted); font-weight: 600; text-decoration: none; }
.brand:hover { color: var(--text); }
h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.2; }
h2 { margin: 32px 0 10px; font-size: 18px; }
p { margin: 0 0 14px; }
.lede, .muted { color: var(--muted); }
.card { padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
form { margin: 0; }
label { display: block; margin: 0 0 14px; }
label span { display: block; margin-bottom: 5px; font-size: 14px; color: var(--muted); }
input[type=text], input[type=password] {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 9px;
}
input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, .btn {
  display: inline-block; padding: 10px 16px; font: inherit; font-weight: 600; color: var(--on-accent);
  background: var(--accent); border: 1px solid var(--accent); border-radius: 9px; cursor: pointer; text-decoration: none;
}
button.quiet, .btn.quiet { color: var(--text); background: transparent; border-color: var(--line); }
.full { width: 100%; }
.alert { padding: 10px 14px; margin: 0 0 16px; border-radius: 10px; border: 1px solid var(--line); }
.alert.bad { border-color: var(--danger); color: var(--danger); }
.links { margin-top: 18px; font-size: 15px; color: var(--muted); }
.links a { color: var(--text); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.copy { width: 100%; padding: 10px 12px; font: 13px/1.4 ui-monospace, monospace; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 9px; overflow-wrap: anywhere; user-select: all; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
td form { display: inline; }
td button { padding: 6px 10px; font-size: 14px; }
.tag { padding: 1px 8px; font-size: 12px; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); }
@media (max-width: 560px) { th:nth-child(3), td:nth-child(3) { display: none; } }
</style>
</head>
<body>
<main>
<a class="brand" href="/">← {{.Theme.Title}}</a>
{{if .Flash}}<p class="alert" role="status">{{.Flash}}</p>{{end}}
{{if .Error}}<p class="alert bad" role="alert">{{.Error}}</p>{{end}}
{{end}}

{{define "bottom"}}
</main>
</body>
</html>{{end}}
